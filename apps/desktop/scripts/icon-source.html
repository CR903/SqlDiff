<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SqlDiff application icon</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .compact-art {
        display: none;
      }

      /* Small rendered sizes (16/32) switch to the bold, text-free variant. */
      @media (max-width: 32px) {
        .standard-art {
          display: none;
        }

        .compact-art {
          display: inline;
        }
      }
    </style>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1024 1024"
      role="img"
      aria-labelledby="title description"
      preserveAspectRatio="xMidYMid meet"
    >
      <title id="title">SqlDiff</title>
      <desc id="description">
        Two database cylinders (indigo source, cyan target) joined by a bidirectional diff arrow, with SQL
        wordmark below.
      </desc>

      <defs>
        <linearGradient id="background" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#172033" />
          <stop offset="0.48" stop-color="#0b0f14" />
          <stop offset="1" stop-color="#080b10" />
        </linearGradient>

        <linearGradient id="databaseA" x1="176" y1="232" x2="402" y2="678" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#818cf8" />
          <stop offset="0.48" stop-color="#6366f1" />
          <stop offset="1" stop-color="#4338ca" />
        </linearGradient>

        <linearGradient id="databaseB" x1="622" y1="232" x2="848" y2="678" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#67e8f9" />
          <stop offset="0.52" stop-color="#22d3ee" />
          <stop offset="1" stop-color="#0891b2" />
        </linearGradient>

        <linearGradient id="arrowStroke" x1="448" y1="360" x2="576" y2="600" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#a5b4fc" />
          <stop offset="0.5" stop-color="#f8fafc" />
          <stop offset="1" stop-color="#67e8f9" />
        </linearGradient>

        <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.42" />
        </filter>

        <filter id="databaseShadow" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.48" />
        </filter>

        <filter id="diffGlow" x="-80%" y="-60%" width="260%" height="220%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <clipPath id="panelClip">
          <rect x="48" y="48" width="928" height="928" rx="212" />
        </clipPath>
      </defs>

      <!-- Panel background: rounded square with safe inset for macOS, full-bleed for Windows. -->
      <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#background)" filter="url(#panelShadow)" />
      <rect
        x="49.5"
        y="49.5"
        width="925"
        height="925"
        rx="210.5"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.13"
        stroke-width="3"
      />

      <!-- ==================== Standard art (48px and up) ==================== -->
      <g class="standard-art">
        <g clip-path="url(#panelClip)" opacity="0.12" fill="none" stroke="#a5b4fc" stroke-width="2">
          <path d="M48 208H976" />
          <path d="M48 344H976" />
          <path d="M48 480H976" />
          <path d="M48 616H976" />
          <path d="M48 752H976" />
          <path d="M208 48V976" />
          <path d="M344 48V976" />
          <path d="M480 48V976" />
          <path d="M616 48V976" />
          <path d="M752 48V976" />
          <path d="M888 48V976" />
        </g>

        <!-- Database A (source schema) -->
        <g filter="url(#databaseShadow)">
          <path d="M136 260V596C136 646 206 686 292 686S448 646 448 596V260H136Z" fill="url(#databaseA)" />
          <ellipse cx="292" cy="260" rx="156" ry="66" fill="url(#databaseA)" />
          <ellipse cx="292" cy="254" rx="132" ry="44" fill="#a5b4fc" fill-opacity="0.28" />
          <path d="M140 380C158 412 218 432 292 432S426 412 444 380" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="12" />
          <path d="M140 492C158 524 218 544 292 544S426 524 444 492" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="12" />
        </g>

        <!-- Database B (target schema) -->
        <g filter="url(#databaseShadow)">
          <path d="M576 260V596C576 646 646 686 732 686S888 646 888 596V260H576Z" fill="url(#databaseB)" />
          <ellipse cx="732" cy="260" rx="156" ry="66" fill="url(#databaseB)" />
          <ellipse cx="732" cy="254" rx="132" ry="44" fill="#cffafe" fill-opacity="0.3" />
          <path d="M580 380C598 412 658 432 732 432S866 412 884 380" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="12" />
          <path d="M580 492C598 524 658 544 732 544S866 524 884 492" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="12" />
        </g>

        <!-- Source/target letters -->
        <g
          fill="#ffffff"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="150"
          font-weight="800"
          text-anchor="middle"
        >
          <text x="292" y="546">A</text>
          <text x="732" y="546">B</text>
        </g>

        <!-- Diff arrows between the two schemas (bold, high contrast) -->
        <g
          fill="none"
          stroke="url(#arrowStroke)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#diffGlow)"
        >
          <path d="M452 396H572" />
          <path d="M522 350L572 396L522 442" />
          <path d="M572 536H452" />
          <path d="M502 490L452 536L502 582" />
        </g>

        <!-- Diff line: indigo | white | cyan -->
        <g fill="none" stroke-linecap="round">
          <path d="M160 748H864" stroke="#6366f1" stroke-width="10" stroke-opacity="0.95" />
          <path d="M392 748H632" stroke="#f8fafc" stroke-width="10" />
          <path d="M632 748H864" stroke="#22d3ee" stroke-width="10" stroke-opacity="0.95" />
        </g>

        <!-- SQL wordmark -->
        <text
          x="512"
          y="900"
          fill="#f8fafc"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="152"
          font-weight="850"
          letter-spacing="14"
          text-anchor="middle"
        >SQL</text>
      </g>

      <!-- ==================== Compact art (16px / 32px): bold, text-free ==================== -->
      <g class="compact-art">
        <!-- Two fat cylinders: only silhouette + one highlight band each -->
        <g>
          <path d="M112 288V660C112 726 174 760 248 760S384 726 384 660V288H112Z" fill="#4f46e5" />
          <ellipse cx="248" cy="288" rx="136" ry="104" fill="#818cf8" />
          <ellipse cx="248" cy="276" rx="104" ry="58" fill="#c7d2fe" />
          <path d="M116 470C146 504 192 520 248 520S350 504 380 470" fill="none" stroke="#e0e7ff" stroke-opacity="0.95" stroke-width="34" />
        </g>
        <g>
          <path d="M640 288V660C640 726 702 760 776 760S912 726 912 660V288H640Z" fill="#0e7490" />
          <ellipse cx="776" cy="288" rx="136" ry="104" fill="#22d3ee" />
          <ellipse cx="776" cy="276" rx="104" ry="58" fill="#a5f3fc" />
          <path d="M644 470C674 504 720 520 776 520S878 504 908 470" fill="none" stroke="#cffafe" stroke-opacity="0.95" stroke-width="34" />
        </g>

        <!-- Oversized diff arrows: one right, one left, no overlap with cylinders -->
        <g
          fill="none"
          stroke="#f8fafc"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M444 430H580" />
          <path d="M520 372L580 430L520 488" />
          <path d="M580 606H444" />
          <path d="M504 548L444 606L504 664" />
        </g>
      </g>
    </svg>
  </body>
</html>
